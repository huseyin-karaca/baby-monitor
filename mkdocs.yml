site_name: Baby Monitor with Star Quality
site_description: >-
  A smart baby monitor that tracks a baby's temperature, movement, sleep and voice: METU EEE capstone design project
  of the team StarSense Ventures, 2023–24.
site_url: https://hkaraca.com/baby-monitor/
repo_url: https://github.com/huseyin-karaca/baby-monitor
repo_name: huseyin-karaca/baby-monitor
copyright: Poster and video © 2024 the StarSense Ventures team
theme:
  name: material
  custom_dir: overrides
  logo: assets/favicon.svg         # tab icons: bin/make_icons.py in the hkaraca.com repo
  favicon: assets/favicon.svg
  font: false                      # Schibsted Grotesk and JetBrains Mono come from docs/stylesheets/extra.css
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.footer
nav:
  - Home: index.md
extra:
  social:
    - icon: fontawesome/solid/house
      link: https://hkaraca.com/
      name: Hüseyin Karaca
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
